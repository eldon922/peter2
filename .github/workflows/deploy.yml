name: Build & Deploy Peter2

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: peter2-image
  CONTAINER_NAME: peter2-container

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Build image and load it on the server
        run: |
          docker buildx build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }} \
            --build-arg NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ secrets.NEXT_PUBLIC_SUPPORT_WHATSAPP }} \
            --build-arg NEXT_PUBLIC_FACEBOOK_APP_ID=${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_ID }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            --output type=docker,dest=- . | \
          ssh -p ${{ secrets.SERVER_PORT || 22 }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'docker load'

      - name: Restart container on server
        run: |
          ssh -p ${{ secrets.SERVER_PORT || 22 }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} '
              docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
              docker rm   ${{ env.CONTAINER_NAME }} 2>/dev/null || true

              docker run -d \
                --memory="3G" \
                --memory-reservation="3G" \
                --cpus="0.8" \
                --restart=always \
                --env-file ~/.peter2-env \
                --network="host" \
                --name ${{ env.CONTAINER_NAME }} \
                ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

              sleep 5

              echo "✅ Deployed ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
              docker logs --tail 50 ${{ env.CONTAINER_NAME }}
            '

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
